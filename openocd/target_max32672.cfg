# MAX32672 target config for wireless-esp8266-dap / elaphureLink OpenOCD
#
# Analog Devices (Maxim) MAX32672 — ARM Cortex-M4F
#   Flash:  1 MB at 0x10000000  (128 × 8 kB sectors)
#   SRAM:  160 kB at 0x20000000
#   FLC base: 0x40029000
#
# Verify FLC base and flash size against your specific MAX32672 variant
# (MAX32672EVKIT schematic / User's Guide, Table 3-1).
#
# Usage:
#   c:\openocd\elaphurelink\bin\openocd.exe \
#     -s c:\openocd\elaphurelink\share\openocd\scripts \
#     -f openocd/elaphurelink.cfg \
#     -f openocd/target_max32672.cfg

# Lower speed for WiFi latency; increase to 4000 after confirmed connection
adapter speed 1000

reset_config srst_only

# SWD tap — Cortex-M4 standard DPIDR
swd newdap max32672 cpu -irlen 4 -irmask 0xf -expected-id 0x2ba01477 -ignore-version

dap create max32672.dap -chain-position max32672.cpu

# Use 32 kB of SRAM as work-area for flash algorithm
target create max32672.cpu cortex_m -dap max32672.dap
max32672.cpu configure -work-area-phys 0x20000000 -work-area-size 0x8000 -work-area-backup 0

# Flash bank: max32xxx driver
#   base=0x10000000  size=0x100000 (1MB)
#   FLC base=0x40029000  sector=0x2000 (8kB)  clock=100 (MHz, IPO)
flash bank max32672.flash max32xxx 0x10000000 0x100000 0 0 max32672.cpu 0x40029000 0x2000 100
