# wireless-esp8266-dap — OpenOCD interface via CMSIS-DAP TCP (bridge)
#
# Use with the MAIN xPack OpenOCD: c:\openocd\bin\openocd.exe
# Requires cmsis_dap_tcp_bridge.py running first (see openocd/cmsis_dap_tcp_bridge.py).
#
# The bridge connects to the device via elaphureLink (TCP 3240),
# does the handshake, then proxies raw DAP bytes to/from OpenOCD.
#
# Usage:
#   python openocd/cmsis_dap_tcp_bridge.py          # terminal 1
#   openocd -f openocd/cmsis-dap-tcp.cfg -f target/stm32f4x.cfg  # terminal 2

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 127.0.0.1
cmsis-dap tcp port 4441

adapter speed 1000
