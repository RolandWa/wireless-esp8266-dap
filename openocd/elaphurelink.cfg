# wireless-esp8266-dap — OpenOCD interface via elaphureLink
#
# Use with: c:\openocd\elaphurelink\bin\openocd.exe
#
# The elaphureLink backend speaks the elaphureLink binary protocol directly
# over TCP port 3240.  No USB driver, no USBIP kernel driver required.
#
# dap.local resolves via mDNS (Bonjour / Windows 10+ built-in).
# Replace with the IP address if mDNS is unavailable.
#
# Usage:
#   openocd -f openocd/elaphurelink.cfg -f target/stm32f4x.cfg
#   openocd -f openocd/elaphurelink.cfg -f openocd/target_stm32f4.cfg

adapter driver cmsis-dap
cmsis-dap backend elaphurelink
cmsis-dap elaphurelink addr dap.local

# Increase timeout for WiFi latency
adapter speed 1000
